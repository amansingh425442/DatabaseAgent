services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: olist
      POSTGRES_USER: olist_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure_local.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - olist_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist_admin -d olist"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  olist_postgres:
